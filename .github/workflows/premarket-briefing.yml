name: Premarket Briefing

on:
  schedule:
    # Weekdays 07:30 KST = Sun-Thu 22:30 UTC.
    - cron: '30 22 * * 0-4'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Generate premarket briefing
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SEND_FCM: ${{ vars.SEND_PREMARKET_FCM }}
          FCM_TOPIC: ${{ vars.PREMARKET_FCM_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node premarket_briefing.js

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: premarket-briefing
          path: scraper/out/premarket/*.md
          if-no-files-found: error
