name: FMKorea Scraper

on:
  schedule:
    # HOT 종목(mentions): 매시 5분 (UTC 기준)
    - cron: '5 * * * *'
    # 펨코 지수: 09:00, 13:00, 18:00, 23:00 KST
    - cron: '0 0,4,9,14 * * *'
  workflow_dispatch:

jobs:
  scrape-index:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0,4,9,14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Run FMKorea index scraper
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fmkorea_scraper.js

  scrape-hot-stocks:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Run FMKorea hot stocks scraper
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_MODE: today
        run: node fmkorea_yesterday_mentions_scraper.js
