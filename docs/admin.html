<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식저장소 관리자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A0E1A; color: #e0e0e0; min-height: 100vh; }

    /* 로그인 */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    #login-screen h1 { color: #4ADE80; font-size: 24px; margin-bottom: 32px; }
    #login-screen input {
      width: 100%; max-width: 320px; padding: 12px 16px;
      background: #1A2035; border: 1px solid #2a3550; border-radius: 10px;
      color: #fff; font-size: 15px; margin-bottom: 12px; outline: none;
    }
    #login-screen input:focus { border-color: #4ADE80; }
    #login-btn {
      width: 100%; max-width: 320px; padding: 13px;
      background: #4ADE80; color: #0A0E1A; font-size: 16px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer; margin-top: 4px;
    }
    #login-btn:hover { background: #22c55e; }
    .divider-row {
      display: flex; align-items: center; gap: 10px;
      width: 100%; max-width: 320px; margin: 12px 0;
    }
    .divider-row span { color: #444; font-size: 13px; white-space: nowrap; }
    .divider-row::before, .divider-row::after {
      content: ''; flex: 1; height: 1px; background: #2a3550;
    }
    #google-btn {
      width: 100%; max-width: 320px; padding: 12px;
      background: #fff; color: #222; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    #google-btn:hover { background: #f0f0f0; }
    #login-error { color: #f87171; font-size: 13px; margin-top: 8px; }

    /* 어드민 */
    #admin-screen { display: none; }
    header {
      background: #1A2035; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a3550; position: sticky; top: 0; z-index: 10;
    }
    header h1 { color: #4ADE80; font-size: 18px; font-weight: 700; }
    #logout-btn {
      background: none; border: 1px solid #2a3550; color: #aaa;
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    #logout-btn:hover { border-color: #4ADE80; color: #4ADE80; }

    .tabs {
      display: flex; gap: 0; background: #1A2035;
      border-bottom: 1px solid #2a3550;
    }
    .tab-btn {
      padding: 14px 24px; background: none; border: none; color: #888;
      font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #4ADE80; border-bottom-color: #4ADE80; }

    .tab-content { display: none; padding: 24px; max-width: 800px; margin: 0 auto; }
    .tab-content.active { display: block; }

    .section-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 16px; }

    /* 폼 */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    input[type=text], input[type=number], input[type=date], textarea, select {
      width: 100%; padding: 10px 12px;
      background: #1A2035; border: 1px solid #2a3550; border-radius: 8px;
      color: #fff; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #4ADE80; }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: #1A2035; }

    .checkbox-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0;
    }
    .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: #4ADE80; }
    .checkbox-row label { margin: 0; font-size: 14px; color: #ccc; }

    .submit-btn {
      margin-top: 20px; width: 100%; padding: 13px;
      background: #4ADE80; color: #0A0E1A; font-size: 15px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
    }
    .submit-btn:hover { background: #22c55e; }
    .submit-btn:disabled { background: #2a3550; color: #666; cursor: not-allowed; }

    .msg { margin-top: 12px; font-size: 13px; padding: 10px 14px; border-radius: 8px; display: none; }
    .msg.success { background: rgba(74,222,128,0.15); color: #4ADE80; display: block; }
    .msg.error { background: rgba(248,113,113,0.15); color: #f87171; display: block; }

    /* 목록 */
    .pick-list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .pick-card {
      background: #1A2035; border: 1px solid #2a3550; border-radius: 12px; padding: 16px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .pick-card-info { flex: 1; }
    .pick-card-name { font-weight: 700; color: #fff; font-size: 15px; }
    .pick-card-meta { font-size: 12px; color: #888; margin-top: 4px; }
    .pick-card-reason { font-size: 13px; color: #aaa; margin-top: 6px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
      margin-right: 4px;
    }
    .badge-active { background: rgba(74,222,128,0.2); color: #4ADE80; }
    .badge-completed { background: rgba(148,163,184,0.2); color: #94a3b8; }
    .badge-premium { background: rgba(251,191,36,0.2); color: #fbbf24; }
    .pick-card-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .action-btn {
      padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
      border: none; cursor: pointer;
    }
    .btn-complete { background: rgba(74,222,128,0.15); color: #4ADE80; }
    .btn-complete:hover { background: rgba(74,222,128,0.3); }
    .btn-delete { background: rgba(248,113,113,0.15); color: #f87171; }
    .btn-delete:hover { background: rgba(248,113,113,0.3); }

    .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1px solid #2a3550; background: none; color: #888; cursor: pointer;
    }
    .filter-btn.active { border-color: #4ADE80; color: #4ADE80; background: rgba(74,222,128,0.1); }

    /* 알림 */
    .noti-form { display: flex; flex-direction: column; gap: 12px; }

    /* 종목 마감 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1A2035; border: 1px solid #2a3550; border-radius: 16px;
      padding: 24px; width: 320px;
    }
    .modal h3 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
    .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
    .modal-cancel { background: #2a3550; color: #aaa; }
    .modal-confirm { background: #4ADE80; color: #0A0E1A; }

    /* 시황분석 디테일 모달 */
    #analysis-modal .modal { width: 600px; max-width: 90vw; max-height: 80vh; display: flex; flex-direction: column; }
    #analysis-modal .modal-body { overflow-y: auto; margin-top: 12px; flex: 1; }
    #an-detail-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    #an-detail-date { font-size: 12px; color: #888; margin-bottom: 16px; }
    #an-detail-body { font-size: 14px; color: #ccc; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

    /* 시황분석 탭 넓게 + 리치 에디터 */
    #tab-analysis.tab-content { max-width: 1080px; }
    .rich-editor {
      width: 100%; min-height: 380px; max-height: 72vh; overflow-y: auto;
      padding: 16px 18px; background: #1A2035; border: 1px solid #2a3550;
      border-radius: 8px; color: #fff; font-size: 15px; line-height: 1.75;
      outline: none; word-break: break-word;
    }
    .rich-editor:focus { border-color: #4ADE80; }
    .rich-editor:empty::before {
      content: attr(data-placeholder); color: #555; pointer-events: none;
    }
    .rich-editor img {
      display: block; max-width: 100%; max-height: 380px; object-fit: contain;
      border-radius: 8px; border: 1px solid #2a3550; margin: 12px 0;
    }

    .loading { text-align: center; color: #555; padding: 40px; }
    #kakao-btn {
      width: 100%; max-width: 320px; padding: 12px;
      background: #FEE500; color: #191919; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 8px;
    }
    #kakao-btn:hover { background: #e6cf00; }
  </style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <h1>📊 주식저장소 관리자</h1>
  <input type="email" id="email-input" placeholder="이메일" />
  <input type="password" id="pw-input" placeholder="비밀번호" />
  <button id="login-btn" onclick="doLogin()">로그인</button>
  <div class="divider-row"><span>또는</span></div>
  <button id="google-btn" onclick="doGoogleLogin()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google로 로그인
  </button>
  <button id="kakao-btn" onclick="doKakaoLogin()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#191919"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.667 1.6 5.013 4 6.4L5 21l4.667-2.8c.756.1 1.538.3 2.333.3 5.523 0 10-3.477 10-7.5S17.523 3 12 3z"/></svg>
    카카오로 로그인
  </button>
  <p id="login-error"></p>
</div>

<!-- 어드민 -->
<div id="admin-screen">
  <header>
    <h1>📊 관리자 패널</h1>
    <button id="logout-btn" onclick="doLogout()">로그아웃</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-add', this)">종목 추가</button>
    <button class="tab-btn" onclick="switchTab('tab-list', this)">종목 목록</button>
    <button class="tab-btn" onclick="switchTab('tab-analysis', this)">시황 분석</button>
    <button class="tab-btn" onclick="switchTab('tab-noti', this)">알림 발송</button>
  </div>

  <!-- 탭1: 종목 추가 -->
  <div id="tab-add" class="tab-content active">
    <p class="section-title">새 추천종목 등록</p>
    <div class="form-grid">
      <div>
        <label>티커 (예: 005930, AAPL)</label>
        <input type="text" id="f-ticker" placeholder="티커" />
      </div>
      <div>
        <label>종목명</label>
        <input type="text" id="f-name" placeholder="삼성전자" />
      </div>
      <div>
        <label>매수가 (원/달러)</label>
        <input type="number" id="f-buy" placeholder="70000" />
      </div>
      <div>
        <label>목표가 (원/달러)</label>
        <input type="number" id="f-target" placeholder="90000" />
      </div>
      <div>
        <label>시장</label>
        <select id="f-market">
          <option value="KS">KOSPI (KS)</option>
          <option value="KQ">KOSDAQ (KQ)</option>
          <option value="US">미국 (US)</option>
        </select>
      </div>
      <div>
        <label>분류</label>
        <select id="f-category">
          <option value="단기">단기</option>
          <option value="장기">장기</option>
        </select>
      </div>
      <div>
        <label>실적 발표일 (선택)</label>
        <input type="date" id="f-earnings" />
      </div>
      <div>
        <label>이미지 URL (선택)</label>
        <input type="text" id="f-image" placeholder="https://..." />
      </div>
      <div class="form-full">
        <label>추천 이유</label>
        <textarea id="f-reason" placeholder="종목 추천 이유를 입력하세요..."></textarea>
      </div>
      <div class="form-full">
        <div class="checkbox-row">
          <input type="checkbox" id="f-premium" />
          <label for="f-premium">프리미엄 종목</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f-noti" checked />
          <label for="f-noti">추가 시 푸시 알림 발송</label>
        </div>
      </div>
    </div>
    <button class="submit-btn" id="add-btn" onclick="addPick()">종목 추가하기</button>
    <div id="add-msg" class="msg"></div>
  </div>

  <!-- 탭2: 종목 목록 -->
  <div id="tab-list" class="tab-content">
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterPicks('all', this)">전체</button>
      <button class="filter-btn" onclick="filterPicks('active', this)">진행 중</button>
      <button class="filter-btn" onclick="filterPicks('completed', this)">완료</button>
    </div>
    <div id="pick-list" class="pick-list">
      <p class="loading">목록 불러오는 중...</p>
    </div>
  </div>

  <!-- 탭3: 시황 분석 -->
  <div id="tab-analysis" class="tab-content">
    <p class="section-title">시황 분석 작성</p>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <label>제목</label>
        <input type="text" id="an-title" placeholder="예: 2024년 4월 2주차 시황 분석" />
      </div>
      <div>
        <label>내용 · 캡처한 이미지를 본문에 바로 붙여넣기(Ctrl+V) 하세요</label>
        <div id="an-body" class="rich-editor" contenteditable="true"
             data-placeholder="시황 분석 내용을 입력하세요. 이미지는 복사해서 본문에 바로 붙여넣거나(Ctrl+V) 드래그하면 그 자리에 삽입됩니다."></div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <button type="button" onclick="document.getElementById('an-img-input').click()" style="
            background:none;border:1px solid #2a3550;color:#94a3b8;
            padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12px;">
            🖼 이미지 파일 선택
          </button>
          <span style="font-size:11px;color:#555;">본문에 바로 붙여넣기/드래그도 가능 · 장수 제한 없음</span>
          <input type="file" id="an-img-input" accept="image/*" multiple style="display:none" onchange="handleImgSelect(this.files)" />
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="submit-btn" id="an-btn" onclick="addAnalysis()" style="flex:1;">시황 분석 등록</button>
        <button id="an-cancel-edit-btn" onclick="cancelAnalysisEdit()" style="
          display:none;padding:12px 16px;border:none;border-radius:8px;
          background:#2a3550;color:#cbd5e1;font-weight:700;cursor:pointer;
        ">수정 취소</button>
      </div>
      <div id="an-msg" class="msg"></div>
    </div>

    <p class="section-title" style="margin-top:32px;">등록된 시황 분석</p>
    <div id="analysis-list" class="pick-list">
      <p class="loading">불러오는 중...</p>
    </div>
  </div>

  <!-- 탭4: 알림 -->
  <div id="tab-noti" class="tab-content">
    <p class="section-title">푸시 알림 발송</p>
    <div class="noti-form">
      <div>
        <label>제목</label>
        <input type="text" id="noti-title" placeholder="알림 제목" />
      </div>
      <div>
        <label>내용</label>
        <textarea id="noti-body" placeholder="알림 내용을 입력하세요..."></textarea>
      </div>
      <button class="submit-btn" onclick="sendNoti()">알림 발송</button>
      <div id="noti-msg" class="msg"></div>
    </div>
  </div>
</div>

<!-- 시황분석 디테일 모달 -->
<div class="modal-overlay" id="analysis-modal">
  <div class="modal">
    <h3>시황 분석</h3>
    <div class="modal-body">
      <div id="an-detail-title"></div>
      <div id="an-detail-date"></div>
      <div id="an-detail-images" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;"></div>
      <div id="an-detail-body"></div>
    </div>
    <div class="modal-btns" style="margin-top:16px;">
      <button class="modal-cancel" onclick="closeAnalysisModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 마감 모달 -->
<div class="modal-overlay" id="complete-modal">
  <div class="modal">
    <h3>종목 마감</h3>
    <label>실제 청산가</label>
    <input type="number" id="close-price-input" placeholder="청산가 입력" style="margin-top:8px;" />
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-confirm" onclick="confirmComplete()">확인</button>
    </div>
  </div>
</div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    GoogleAuthProvider, signInWithPopup, signInWithCustomToken }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc,
    serverTimestamp, query, orderBy, Timestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyDIp4yXMzaYXj_XKv8UBrck6fzar4a0TgQ',
    authDomain: 'stockstorage-13828.firebaseapp.com',
    projectId: 'stockstorage-13828',
    storageBucket: 'stockstorage-13828.firebasestorage.app',
    messagingSenderId: '475716336297',
    appId: '1:475716336297:web:79645b5453cc769586c7b8',
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const functions = getFunctions(app, 'asia-northeast3');

  Kakao.init('b191753c48f2905ad615405358d53eba');

  let allPicks = [];
  let currentFilter = 'all';
  let pendingCompleteId = null;

  // 인증 상태 감시
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadPicks();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-screen').style.display = 'none';
    }
  });

  // 로그인
  window.doLogin = async () => {
    const email = document.getElementById('email-input').value.trim();
    const pw = document.getElementById('pw-input').value;
    const errEl = document.getElementById('login-error');
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      errEl.textContent = '';
    } catch(e) {
      errEl.textContent = '이메일 또는 비밀번호가 틀렸습니다.';
    }
  };

  window.doGoogleLogin = async () => {
    const errEl = document.getElementById('login-error');
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
      errEl.textContent = '';
    } catch(e) {
      errEl.textContent = '구글 로그인 실패: ' + e.message;
    }
  };

  const KAKAO_REDIRECT_URI = 'https://alstjr0307.github.io/stockstorage/admin.html';

  window.doKakaoLogin = () => {
    Kakao.Auth.authorize({ redirectUri: KAKAO_REDIRECT_URI });
  };

  // 카카오 redirect 후 code 처리
  const kakaoCode = new URLSearchParams(window.location.search).get('code');
  if (kakaoCode) {
    window.history.replaceState({}, '', window.location.pathname);
    const errEl = document.getElementById('login-error');
    (async () => {
      try {
        const kakaoAuthCode = httpsCallable(functions, 'kakaoAuthCode');
        const { data } = await kakaoAuthCode({ code: kakaoCode, redirectUri: KAKAO_REDIRECT_URI });
        await signInWithCustomToken(auth, data.customToken);
      } catch(e) {
        errEl.textContent = '카카오 로그인 실패: ' + (e.message || JSON.stringify(e));
      }
    })();
  }

  window.doLogout = () => signOut(auth);

  // 탭 전환
  window.switchTab = (id, btn) => {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    if (id === 'tab-list') loadPicks();
    if (id === 'tab-analysis') loadAnalyses();
  };

  // 종목 추가
  window.addPick = async () => {
    const btn = document.getElementById('add-btn');
    const msg = document.getElementById('add-msg');
    const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
    const name = document.getElementById('f-name').value.trim();
    const buy = parseFloat(document.getElementById('f-buy').value);
    const target = parseFloat(document.getElementById('f-target').value);
    const reason = document.getElementById('f-reason').value.trim();
    const market = document.getElementById('f-market').value;
    const category = document.getElementById('f-category').value;
    const isPremium = document.getElementById('f-premium').checked;
    const sendNotiFlag = document.getElementById('f-noti').checked;
    const imageUrl = document.getElementById('f-image').value.trim() || null;
    const earningsVal = document.getElementById('f-earnings').value;

    if (!ticker || !name || isNaN(buy) || isNaN(target) || !reason) {
      showMsg(msg, 'error', '티커, 종목명, 매수가, 목표가, 추천이유는 필수입니다.');
      return;
    }

    btn.disabled = true;
    btn.textContent = '등록 중...';
    try {
      const data = {
        ticker, name, buyPrice: buy, targetPrice: target,
        reason, market, category, isPremium,
        imageUrl, currentPrice: null,
        status: 'active',
        upVotes: 0, downVotes: 0,
        createdAt: serverTimestamp(),
      };
      if (earningsVal) data.earningsDate = Timestamp.fromDate(new Date(earningsVal));

      await addDoc(collection(db, 'stock_picks'), data);

      if (sendNotiFlag) {
        await addDoc(collection(db, 'notification_queue'), {
          title: `📈 새 추천종목: ${name}`,
          body: `${ticker} · 목표가 ${target.toLocaleString()}`,
          createdAt: serverTimestamp(),
        });
      }

      showMsg(msg, 'success', `✓ ${name}(${ticker}) 종목이 추가되었습니다.`);
      // 폼 초기화
      ['f-ticker','f-name','f-buy','f-target','f-reason','f-image','f-earnings']
        .forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-premium').checked = false;
    } catch(e) {
      showMsg(msg, 'error', '오류: ' + e.message);
    }
    btn.disabled = false;
    btn.textContent = '종목 추가하기';
  };

  // 목록 로드
  window.loadPicks = async () => {
    const listEl = document.getElementById('pick-list');
    listEl.innerHTML = '<p class="loading">불러오는 중...</p>';
    try {
      const q = query(collection(db, 'stock_picks'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allPicks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPicks();
    } catch(e) {
      listEl.innerHTML = `<p class="loading" style="color:#f87171;">오류: ${e.message}</p>`;
    }
  };

  window.filterPicks = (filter, btn) => {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPicks();
  };

  function renderPicks() {
    const listEl = document.getElementById('pick-list');
    const filtered = currentFilter === 'all' ? allPicks
      : allPicks.filter(p => p.status === currentFilter);

    if (filtered.length === 0) {
      listEl.innerHTML = '<p class="loading">종목이 없습니다.</p>';
      return;
    }

    listEl.innerHTML = filtered.map(p => {
      const ret = (((p.targetPrice - p.buyPrice) / p.buyPrice) * 100).toFixed(1);
      const date = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString('ko-KR') : '';
      return `
        <div class="pick-card">
          <div class="pick-card-info">
            <div class="pick-card-name">
              ${p.name} <span style="color:#888;font-weight:400;font-size:13px;">${p.ticker}</span>
            </div>
            <div class="pick-card-meta" style="margin-top:6px;">
              <span class="badge ${p.status === 'active' ? 'badge-active' : 'badge-completed'}">
                ${p.status === 'active' ? '진행 중' : '완료'}
              </span>
              ${p.isPremium ? '<span class="badge badge-premium">프리미엄</span>' : ''}
              <span style="color:#94a3b8;">${p.market} · ${p.category}</span>
            </div>
            <div class="pick-card-meta">
              매수 ${p.buyPrice?.toLocaleString()} → 목표 ${p.targetPrice?.toLocaleString()}
              <span style="color:#4ADE80;margin-left:6px;">+${ret}%</span>
              ${p.closedPrice ? `<span style="color:#94a3b8;margin-left:6px;">청산 ${p.closedPrice.toLocaleString()}</span>` : ''}
            </div>
            <div class="pick-card-reason">${p.reason?.substring(0, 80)}${p.reason?.length > 80 ? '...' : ''}</div>
            <div class="pick-card-meta" style="margin-top:4px;">${date}</div>
          </div>
          <div class="pick-card-actions">
            ${p.status === 'active' ? `<button class="action-btn btn-complete" onclick="openCompleteModal('${p.id}')">마감</button>` : ''}
            <button class="action-btn btn-delete" onclick="deletePick('${p.id}', '${p.name}')">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 마감 모달
  window.openCompleteModal = (id) => {
    pendingCompleteId = id;
    document.getElementById('close-price-input').value = '';
    document.getElementById('complete-modal').classList.add('open');
  };
  window.closeModal = () => {
    document.getElementById('complete-modal').classList.remove('open');
    pendingCompleteId = null;
  };
  window.confirmComplete = async () => {
    const price = parseFloat(document.getElementById('close-price-input').value);
    if (!pendingCompleteId || isNaN(price)) return;
    try {
      await updateDoc(doc(db, 'stock_picks', pendingCompleteId), {
        status: 'completed',
        closedPrice: price,
        closedAt: serverTimestamp(),
      });
      closeModal();
      loadPicks();
    } catch(e) { alert('오류: ' + e.message); }
  };

  // 삭제
  window.deletePick = async (id, name) => {
    if (!confirm(`"${name}" 종목을 삭제할까요?`)) return;
    try {
      await deleteDoc(doc(db, 'stock_picks', id));
      loadPicks();
    } catch(e) { alert('오류: ' + e.message); }
  };

  // 이미지 선택 관리 (본문 인라인 편집기)
  let anImgFiles = [];        // 업로드 대기 중인 파일 { id, file }
  let editingAnalysisId = null;
  const anBodyEl = () => document.getElementById('an-body');

  function makeImgToken(id) {
    return `[[이미지:${id}]]`;
  }

  function uid() {
    return `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  }

  // 현재 커서(또는 본문 끝) 위치에 노드 삽입
  function insertNodeAtCaret(node) {
    const editor = anBodyEl();
    editor.focus();
    const sel = window.getSelection();
    let range;
    if (sel && sel.rangeCount && editor.contains(sel.anchorNode)) {
      range = sel.getRangeAt(0);
      range.deleteContents();
    } else {
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
    }
    const br = document.createElement('br');
    range.insertNode(br);
    range.insertNode(node);
    range.setStartAfter(br);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function insertImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const id = uid();
    anImgFiles.push({ id, file });
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.dataset.localId = id;
    insertNodeAtCaret(img);
  }

  window.handleImgSelect = (files) => {
    Array.from(files).forEach(insertImageFile);
    document.getElementById('an-img-input').value = '';
  };

  // 붙여넣기 / 드래그로 이미지 삽입
  (function setupEditor() {
    const editor = anBodyEl();
    if (!editor) return;
    editor.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items || [];
      const imgs = [];
      for (const it of items) {
        if (it.kind === 'file' && it.type.startsWith('image/')) {
          const f = it.getAsFile();
          if (f) imgs.push(f);
        }
      }
      if (imgs.length) {
        e.preventDefault();
        imgs.forEach(insertImageFile);
      } else {
        // 서식 없는 순수 텍스트로 붙여넣기
        const text = e.clipboardData.getData('text/plain');
        if (text) { e.preventDefault(); document.execCommand('insertText', false, text); }
      }
    });
    editor.addEventListener('dragover', (e) => { e.preventDefault(); editor.style.borderColor = '#4ADE80'; });
    editor.addEventListener('dragleave', () => { editor.style.borderColor = ''; });
    editor.addEventListener('drop', (e) => {
      e.preventDefault();
      editor.style.borderColor = '';
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      files.forEach(insertImageFile);
    });
  })();

  // 편집기 DOM → 본문 텍스트(이미지는 토큰/마크다운). 삭제된 이미지는 자동 제외됨.
  function serializeNode(node) {
    if (node.nodeType === Node.TEXT_NODE) return node.textContent;
    if (node.nodeType !== Node.ELEMENT_NODE) return '';
    const tag = node.tagName;
    if (tag === 'BR') return '\n';
    if (tag === 'IMG') {
      if (node.dataset.localId) return `\n${makeImgToken(node.dataset.localId)}\n`;
      const url = node.dataset.url || node.getAttribute('src');
      return url ? `\n![](${url})\n` : '';
    }
    let inner = '';
    node.childNodes.forEach(c => { inner += serializeNode(c); });
    return (tag === 'DIV' || tag === 'P') ? '\n' + inner : inner;
  }

  function editorToRawBody() {
    let out = '';
    anBodyEl().childNodes.forEach(n => { out += serializeNode(n); });
    return out.replace(/ /g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }

  // 본문 텍스트(마크다운) → 편집기 HTML (수정 모드 로드용)
  function textToHtml(text) {
    return escapeHtml(text).replace(/\n/g, '<br>');
  }

  function bodyToEditorHtml(body = '') {
    const imgPattern = /!\[[^\]]*]\((https?:\/\/[^\s)]+)\)/g;
    let html = '';
    let last = 0, m;
    while ((m = imgPattern.exec(body)) !== null) {
      html += textToHtml(body.slice(last, m.index));
      html += `<img src="${escapeHtml(m[1])}" data-url="${escapeHtml(m[1])}" />`;
      last = m.index + m[0].length;
    }
    html += textToHtml(body.slice(last));
    return html;
  }

  async function uploadAnalysisImages(items) {
    const uploaded = {};
    for (const item of items) {
      const f = item.file;
      const path = `market_analyses/${Date.now()}_${f.name}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, f);
      const url = await getDownloadURL(storageRef);
      uploaded[item.id] = url;
    }
    return uploaded;
  }

  function replaceImageTokens(body, uploaded) {
    let nextBody = body;
    for (const [id, url] of Object.entries(uploaded)) {
      nextBody = nextBody.replaceAll(makeImgToken(id), `![](${url})`);
    }
    return nextBody
      .replace(/\[\[이미지:[^\]]+\]\]/g, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  function resetAnalysisForm() {
    document.getElementById('an-title').value = '';
    anBodyEl().innerHTML = '';
    anImgFiles = [];
    editingAnalysisId = null;
    document.getElementById('an-btn').textContent = '시황 분석 등록';
    document.getElementById('an-cancel-edit-btn').style.display = 'none';
  }

  window.cancelAnalysisEdit = () => {
    resetAnalysisForm();
    showMsg(document.getElementById('an-msg'), 'success', '수정을 취소했습니다.');
  };

  // 시황 분석 등록
  window.addAnalysis = async () => {
    const btn = document.getElementById('an-btn');
    const msg = document.getElementById('an-msg');
    const title = document.getElementById('an-title').value.trim();
    const rawBody = editorToRawBody();
    if (!title || !rawBody) { showMsg(msg, 'error', '제목과 내용을 입력하세요.'); return; }
    btn.disabled = true;
    const isEditing = !!editingAnalysisId;
    btn.textContent = anImgFiles.length > 0 ? '이미지 업로드 중...' : (isEditing ? '수정 중...' : '등록 중...');
    try {
      const usedImages = anImgFiles.filter(item => rawBody.includes(makeImgToken(item.id)));
      const uploaded = usedImages.length > 0 ? await uploadAnalysisImages(usedImages) : {};
      const body = replaceImageTokens(rawBody, uploaded);
      btn.textContent = isEditing ? '수정 중...' : '등록 중...';
      if (isEditing) {
        await updateDoc(doc(db, 'market_analyses', editingAnalysisId), {
          title, body, imageUrls: [],
        });
        delete analysisCache[editingAnalysisId];
        showMsg(msg, 'success', '✓ 시황 분석이 수정되었습니다.');
      } else {
        await addDoc(collection(db, 'market_analyses'), {
          title, body, imageUrls: [], createdAt: serverTimestamp(),
        });
        showMsg(msg, 'success', '✓ 시황 분석이 등록되었습니다.');
      }
      resetAnalysisForm();
      loadAnalyses();
    } catch(e) { showMsg(msg, 'error', '오류: ' + e.message); }
    btn.disabled = false;
    btn.textContent = editingAnalysisId ? '시황 분석 수정 저장' : '시황 분석 등록';
  };

  // 시황 분석 목록 로드
  window.loadAnalyses = async () => {
    const listEl = document.getElementById('analysis-list');
    listEl.innerHTML = '<p class="loading">불러오는 중...</p>';
    try {
      const q = query(collection(db, 'market_analyses'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      if (snap.empty) { listEl.innerHTML = '<p class="loading">등록된 시황 분석이 없습니다.</p>'; return; }
      listEl.innerHTML = snap.docs.map(d => {
        const data = d.data();
        const date = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('ko-KR') : '';
        const preview = data.body?.substring(0, 100) + (data.body?.length > 100 ? '...' : '');
        return `
          <div class="pick-card">
            <div class="pick-card-info">
              <div class="pick-card-name">${data.title}</div>
              <div class="pick-card-reason" style="margin-top:6px;">${preview}</div>
              <div class="pick-card-meta" style="margin-top:4px;">${date}</div>
            </div>
            <div class="pick-card-actions">
              <button class="action-btn btn-complete" onclick="openAnalysisModal('${d.id}')">보기</button>
              <button class="action-btn" onclick="editAnalysis('${d.id}')" style="background:#334155;color:#e2e8f0;">수정</button>
              <button class="action-btn btn-delete" onclick="deleteAnalysis('${d.id}', '${data.title.replace(/'/g, "\\'")}')">삭제</button>
            </div>
          </div>`;
      }).join('');
    } catch(e) {
      listEl.innerHTML = `<p class="loading" style="color:#f87171;">오류: ${e.message}</p>`;
    }
  };

  // 시황 분석 디테일 모달
  let analysisCache = {};
  async function ensureAnalysis(id) {
    if (!analysisCache[id]) {
      const snap = await getDocs(query(collection(db, 'market_analyses')));
      snap.docs.forEach(d => { analysisCache[d.id] = { id: d.id, ...d.data() }; });
    }
    return analysisCache[id];
  }

  function bodyForAnalysisEdit(data) {
    const body = data.body || '';
    const legacyImages = data.imageUrls || [];
    if (!legacyImages.length || body.includes('![](')) return body;
    return [
      body,
      ...legacyImages.map(url => `![](${url})`),
    ].filter(Boolean).join('\n\n');
  }

  function escapeHtml(str = '') {
    return str
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function renderAnalysisBody(body = '') {
    const imgPattern = /!\[[^\]]*]\((https?:\/\/[^\s)]+)\)/g;
    const parts = [];
    let lastIndex = 0;
    let match;
    while ((match = imgPattern.exec(body)) !== null) {
      const before = body.slice(lastIndex, match.index);
      if (before) {
        parts.push(`<p style="white-space:pre-wrap;margin:0 0 12px 0;">${escapeHtml(before)}</p>`);
      }
      const url = match[1];
      parts.push(
        `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">` +
        `<img src="${escapeHtml(url)}" style="display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:8px;border:1px solid #2a3550;margin:8px 0 16px;" />` +
        `</a>`
      );
      lastIndex = match.index + match[0].length;
    }
    const tail = body.slice(lastIndex);
    if (tail) {
      parts.push(`<p style="white-space:pre-wrap;margin:0;">${escapeHtml(tail)}</p>`);
    }
    return parts.length ? parts.join('') : `<p style="white-space:pre-wrap;margin:0;">${escapeHtml(body)}</p>`;
  }

  window.openAnalysisModal = async (id) => {
    document.getElementById('analysis-modal').classList.add('open');
    document.getElementById('an-detail-title').textContent = '불러오는 중...';
    document.getElementById('an-detail-date').textContent = '';
    document.getElementById('an-detail-body').innerHTML = '';
    try {
      const data = await ensureAnalysis(id);
      document.getElementById('an-detail-title').textContent = data.title;
      document.getElementById('an-detail-date').textContent = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('ko-KR') : '';
      document.getElementById('an-detail-body').innerHTML = renderAnalysisBody(data.body || '');
      const imgs = (data.imageUrls || []).filter(url => !String(data.body || '').includes(`![](${url})`));
      const imgsEl = document.getElementById('an-detail-images');
      imgsEl.style.display = imgs.length ? 'flex' : 'none';
      imgsEl.innerHTML = imgs.map(url => `
        <a href="${url}" target="_blank" style="flex-shrink:0;">
          <img src="${url}" style="height:120px;max-width:180px;object-fit:cover;border-radius:8px;border:1px solid #2a3550;cursor:pointer;" />
        </a>`).join('');
    } catch(e) {
      document.getElementById('an-detail-title').textContent = '오류: ' + e.message;
    }
  };
  window.closeAnalysisModal = () => {
    document.getElementById('analysis-modal').classList.remove('open');
  };

  window.editAnalysis = async (id) => {
    try {
      const data = await ensureAnalysis(id);
      editingAnalysisId = id;
      anImgFiles = [];
      document.getElementById('an-title').value = data.title || '';
      anBodyEl().innerHTML = bodyToEditorHtml(bodyForAnalysisEdit(data));
      document.getElementById('an-btn').textContent = '시황 분석 수정 저장';
      document.getElementById('an-cancel-edit-btn').style.display = 'inline-block';
      document.getElementById('an-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
      showMsg(document.getElementById('an-msg'), 'success', '수정할 내용을 불러왔습니다. 기존 본문 이미지 URL은 그대로 유지됩니다.');
    } catch(e) {
      alert('오류: ' + e.message);
    }
  };

  // 시황 분석 삭제
  window.deleteAnalysis = async (id, title) => {
    if (!confirm(`"${title}" 시황 분석을 삭제할까요?`)) return;
    try {
      await deleteDoc(doc(db, 'market_analyses', id));
      delete analysisCache[id];
      if (editingAnalysisId === id) resetAnalysisForm();
      loadAnalyses();
    } catch(e) { alert('오류: ' + e.message); }
  };

  // 알림 발송
  window.sendNoti = async () => {
    const title = document.getElementById('noti-title').value.trim();
    const body = document.getElementById('noti-body').value.trim();
    const msg = document.getElementById('noti-msg');
    if (!title || !body) { showMsg(msg, 'error', '제목과 내용을 입력하세요.'); return; }
    try {
      await addDoc(collection(db, 'notification_queue'), {
        title, body, createdAt: serverTimestamp(),
      });
      showMsg(msg, 'success', '알림이 발송 대기열에 추가되었습니다.');
      document.getElementById('noti-title').value = '';
      document.getElementById('noti-body').value = '';
    } catch(e) { showMsg(msg, 'error', '오류: ' + e.message); }
  };

  function showMsg(el, type, text) {
    el.className = 'msg ' + type;
    el.textContent = text;
    setTimeout(() => { el.className = 'msg'; }, 4000);
  }

  // 엔터로 로그인
  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.doLogin();
  });
</script>
</body>
