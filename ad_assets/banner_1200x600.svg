<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#1A2035"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22D3A6"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2035"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Decorative glow blobs -->
  <circle cx="1050" cy="120" r="180" fill="#4ADE80" opacity="0.12"/>
  <circle cx="120" cy="500" r="220" fill="#4ADE80" opacity="0.08"/>

  <!-- Left side: copy -->
  <g font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <!-- Eyebrow tag -->
    <g transform="translate(70, 90)">
      <rect width="200" height="40" rx="20" fill="#4ADE80" opacity="0.15"/>
      <text x="100" y="27" font-size="20" font-weight="700" fill="#4ADE80" text-anchor="middle">AI 주식 분석</text>
    </g>

    <!-- Headline -->
    <text x="70" y="200" font-size="64" font-weight="900" fill="#FFFFFF">오늘의 종목,</text>
    <text x="70" y="278" font-size="64" font-weight="900" fill="#FFFFFF">
      AI가 <tspan fill="url(#green)">대신 분석</tspan>해드려요
    </text>

    <!-- Sub -->
    <text x="70" y="340" font-size="26" font-weight="500" fill="#A8B0C0">한국·미국 주식 · 매매일지 · 실시간 시세</text>
    <text x="70" y="378" font-size="26" font-weight="500" fill="#A8B0C0">출석만 해도 매일 무료 분석권 지급</text>

    <!-- CTA Button -->
    <g transform="translate(70, 430)">
      <rect width="320" height="86" rx="43" fill="url(#green)"/>
      <text x="160" y="58" font-size="28" font-weight="800" fill="#0A0E1A" text-anchor="middle">지금 무료로 설치하기</text>
    </g>

    <!-- trust line -->
    <text x="70" y="555" font-size="18" font-weight="500" fill="#6B7488">★★★★★ 누적 사용자 추천</text>
  </g>

  <!-- Right side: phone mockup -->
  <g transform="translate(760, 70)" filter="url(#glow)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="340" height="480" rx="42" fill="#000000"/>
    <rect x="10" y="10" width="320" height="460" rx="34" fill="url(#phone)"/>

    <!-- Notch -->
    <rect x="130" y="22" width="80" height="18" rx="9" fill="#000000"/>

    <!-- Status bar -->
    <text x="30" y="68" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>

    <!-- Header -->
    <text x="30" y="110" font-family="'Pretendard',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">주식저장소</text>

    <!-- AI score card -->
    <rect x="24" y="130" width="292" height="120" rx="16" fill="#1A2035" stroke="#4ADE80" stroke-width="1.5" opacity="0.95"/>
    <text x="40" y="158" font-family="sans-serif" font-size="12" font-weight="700" fill="#4ADE80">AI 종합 점수</text>
    <text x="40" y="208" font-family="sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">87</text>
    <text x="105" y="208" font-family="sans-serif" font-size="20" font-weight="600" fill="#A8B0C0">/100</text>
    <text x="40" y="232" font-family="sans-serif" font-size="11" font-weight="500" fill="#A8B0C0">매수 추천 · 단기 모멘텀 우수</text>

    <!-- Chart card -->
    <rect x="24" y="262" width="292" height="120" rx="16" fill="#1A2035" opacity="0.95"/>
    <text x="40" y="288" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">실시간 차트</text>
    <!-- Mini chart line -->
    <polyline points="40,360 70,348 100,355 130,330 160,338 190,310 220,318 250,295 280,285 300,272"
      stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="40,360 70,348 100,355 130,330 160,338 190,310 220,318 250,295 280,285 300,272 300,380 40,380"
      fill="#4ADE80" opacity="0.15"/>

    <!-- Bottom tab -->
    <rect x="24" y="400" width="292" height="56" rx="16" fill="#1A2035" opacity="0.9"/>
    <circle cx="60" cy="428" r="10" fill="#4ADE80"/>
    <text x="78" y="432" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">홈</text>
    <text x="140" y="432" font-family="sans-serif" font-size="11" font-weight="500" fill="#6B7488">커뮤니티</text>
    <text x="210" y="432" font-family="sans-serif" font-size="11" font-weight="500" fill="#6B7488">매매일지</text>
    <text x="278" y="432" font-family="sans-serif" font-size="11" font-weight="500" fill="#6B7488">관심</text>
  </g>
</svg>
