name: Market Feature Stocks

on:
  schedule:
    # Weekdays 15:30 KST = 06:30 UTC.
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  market-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Generate and upload market feature stocks
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FEATURE_MAX_PER_GROUP: ${{ vars.FEATURE_MAX_PER_GROUP }}
          FEATURE_MIN_TRADING_VALUE: ${{ vars.FEATURE_MIN_TRADING_VALUE }}
          FEATURE_VALUE_SPIKE_RATIO: ${{ vars.FEATURE_VALUE_SPIKE_RATIO }}
        run: npm run market-features
