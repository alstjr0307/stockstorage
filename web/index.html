<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="주식저장소 — AI 종목분석, 추천주, 실시간 지수, 시황분석, 시장심리지표">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="주식저장소">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>주식저장소</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #121212; }
    #startup { position: fixed; inset: 0; display: grid; place-content: center;
      padding: 24px; text-align: center; color: #eee; font-family: sans-serif; }
    #startup h1 { font-size: 24px; }
    #startup p { color: #bbb; line-height: 1.6; }
    #startup button { margin: 12px auto; padding: 12px 24px; border: 0;
      border-radius: 10px; background: #90caf9; color: #121212; cursor: pointer; }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite">
    <h1>주식저장소</h1>
    <p id="startup-message">화면을 준비하고 있어요.</p>
    <button id="startup-retry" hidden onclick="location.reload()">다시 시도</button>
  </div>
  <script>
    function showStartupRetry() {
      const message = document.getElementById('startup-message');
      if (!message) return;
      message.textContent = '로딩이 길어지고 있어요. 연결 상태를 확인하고 다시 시도해 주세요.';
      document.getElementById('startup-retry').hidden = false;
    }
    const startupTimer = setTimeout(showStartupRetry, 20000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(startupTimer);
      document.getElementById('startup')?.remove();
    }, { once: true });
  </script>
  <!-- SDK 로딩 중에도 위의 시작 안내를 표시합니다. -->
  <script
    src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
    integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
    crossorigin="anonymous"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="showStartupRetry()"></script>
</body>
</html>
